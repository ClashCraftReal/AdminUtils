plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'maven-publish'
}

def usesRemappingLoom = stonecutter.current.parsed < '26.1'

if (usesRemappingLoom) {
	apply plugin: 'net.fabricmc.fabric-loom-remap'
} else {
	apply plugin: 'net.fabricmc.fabric-loom'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"adminutils" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

group = project.group_id
version = "${project.mod_version}+${stonecutter.current.version}"
base.archivesName = project.mod_id

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (usesRemappingLoom) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
}

def javaVersion = JavaVersion.toVersion(project.java_version)

java {
	withSourcesJar()
	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
}

def modVersion = project.version.toString()
def modLoaderVersion = project.loader_version.toString()
def minecraftDependency = project.minecraft_dependency.toString()
def javaTargetVersion = project.java_version.toString()
def modId = project.mod_id.toString()

processResources {
	inputs.properties([
		'version': modVersion,
		'loader_version': modLoaderVersion,
		'minecraft_dependency': minecraftDependency,
		'java_version': javaTargetVersion
	])

	filesMatching("fabric.mod.json") {
		expand(
			'version': modVersion,
			'loader_version': modLoaderVersion,
			'minecraft_dependency': minecraftDependency,
			'java_version': javaTargetVersion
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion.majorVersion.toInteger()
}

jar {
	from("LICENSE") {
		rename { "${it}_${modId}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
